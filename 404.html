<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IKRAM Bandar Tun Razak</title>
  <meta name="robots" content="noindex">
  <style>body{font-family:sans-serif;text-align:center;padding:48px 16px;margin:0;min-height:100vh;color:#1D3A3C;background:linear-gradient(135deg,#f0fafa 0%,#e0f2f1 100%);}</style>
</head>
<body>
  <p id="m">Membuka pautan...</p>
  <script>
  (function () {
    var slug = location.pathname.replace(/^\/+|\/+$/g, "");
    var m = document.getElementById("m");
    var fail = function () { m.textContent = "Pautan tidak dijumpai."; };
    if (!/^[A-Za-z0-9-]+$/.test(slug)) { fail(); return; }
    var tries = 0;
    (function go() {
      fetch("https://raw.githubusercontent.com/ikram-btr/ikram-btr.github.io/main/" + slug + "/index.html?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw 0; return r.text(); })
        .then(function (t) {
          var x = /<meta name="ibtr-target" content="([^"]+)"/.exec(t);
          if (!x) throw 0;
          var u = x[1].replace(/&quot;/g, "\"").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
          if (!/^https:\/\//.test(u)) throw 0;
          location.replace(u);
        })
        .catch(function () { if (++tries < 4) setTimeout(go, 1500); else fail(); });
    })();
  })();
  </script>
</body>
</html>
